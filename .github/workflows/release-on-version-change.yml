name: Release on Version Change

on:
  push:
    branches: [main]
    paths:
      - "package.json"   # adjust if your package.json is in a folder

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Read version from package.json
        id: ver
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_exists
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if tag already exists
        if: steps.tag_exists.outputs.exists == 'true'
        run: |
          echo "Tag already exists. Skipping."
          exit 0

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Extract and format release notes
        run: |
          VER="${VERSION}"

          awk -v ver="$VER" '
            BEGIN {found=0}
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found==1 && $0 ~ "^## \\[" {exit}
            found==1 {print}
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Changes" > release-notes.md
            echo "" >> release-notes.md
            echo "- Automated release for version $VER." >> release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "IndicatorEngine ${VERSION}" \
            --notes-file release-notes.md